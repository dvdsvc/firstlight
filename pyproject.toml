[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "structured-extract-research"
version = "0.1.0"
description = "Staged scientific entity-tree extraction with linked exports and independent stateful control experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.33.0,<3", "openpyxl>=3.1.5,<4", "python-docx>=1.2,<2", "python-dotenv>=1.2,<2"]
[project.optional-dependencies]
agent = ["mcp[cli]>=1.27.1,<2"]
graph = ["numpy>=2,<3", "scipy>=1.13,<2"]
[project.scripts]
geochron-mcp = "geochron_agent_v3.mcp_server:main"
[tool.setuptools]
py-modules = ["pipeline", "pipeline_v2", "prompts", "prompts_v2", "run_layer1", "run_layer2a", "run_layer2b", "run_layer2c", "filter", "vocab", "export_total", "merge_tree_xlsx"]
[tool.setuptools.packages.find]
include = ["geochron_agent_v3*"]
