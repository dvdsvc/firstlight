name: Offline extraction and control checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          version: "0.11.16"
      - run: uv sync --locked --all-extras
      - run: uv run --locked --all-extras python -B -m unittest discover -s tests -v
      - run: uv run --locked --all-extras python -B -m examples.staged_demo
      - run: uv run --locked --all-extras python -B -m examples.offline_demo
      - run: uv run --locked --all-extras python -B -m examples.graph_demo
      - run: uv run --locked --all-extras python -B -m scripts.mcp_smoke
      - run: uv run --project ../.. --locked --all-extras python -B -m unittest discover -s tests -v
        working-directory: versions/early_v3
      - run: uv run --locked --all-extras python -B -m scripts.check_repository
